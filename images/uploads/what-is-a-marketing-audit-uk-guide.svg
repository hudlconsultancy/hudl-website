<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="What Is a Marketing Audit — And Does Your Business Need One?">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101010"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- four-colour stripe bar -->
  <g>
    <rect x="0" y="0" width="300" height="12" fill="#fbbf46"/>
    <rect x="300" y="0" width="300" height="12" fill="#45aeff"/>
    <rect x="600" y="0" width="300" height="12" fill="#ff515e"/>
    <rect x="900" y="0" width="300" height="12" fill="#1edfd4"/>
  </g>

  <!-- category badge -->
  <g font-family="'Barlow Condensed','Arial Narrow','Helvetica Neue',Impact,sans-serif" font-weight="700">
    <rect x="80" y="86" width="253.5" height="34" rx="2" fill="#1edfd4" opacity="0.16"/>
    <text x="92" y="110" font-size="20" letter-spacing="2" fill="#1edfd4">INDUSTRY INSIGHTS</text>
  </g>

  <!-- title -->
  <text font-family="'Barlow Condensed','Arial Narrow','Helvetica Neue',Impact,sans-serif" font-weight="800" font-size="78" fill="#ffffff" letter-spacing="0.5" style="text-transform:uppercase"><tspan x="80" y="259.2">WHAT IS A</tspan><tspan x="80" y="338.8">MARKETING AUDIT —</tspan><tspan x="80" y="418.3">AND DOES YOUR</tspan><tspan x="80" y="497.9">BUSINESS NEED…</tspan></text>

  <!-- hudl.gg wordmark -->
  <g font-family="'Barlow Condensed','Arial Narrow','Helvetica Neue',Impact,sans-serif" font-weight="900" font-size="34" letter-spacing="3">
    <text x="80" y="619">
      <tspan fill="#fbbf46">H</tspan><tspan fill="#45aeff">U</tspan><tspan fill="#ff515e">D</tspan><tspan fill="#1edfd4">L</tspan><tspan fill="#ffffff" font-size="20" letter-spacing="1"> .GG</tspan>
    </text>
  </g>

  <!-- corner stripe accent (bottom-right) -->
  <g opacity="0.9">
    <rect x="1000" y="663" width="44" height="12" fill="#fbbf46"/>
    <rect x="1048" y="663" width="44" height="12" fill="#45aeff"/>
    <rect x="1096" y="663" width="44" height="12" fill="#ff515e"/>
    <rect x="1144" y="663" width="44" height="12" fill="#1edfd4"/>
  </g>
</svg>
